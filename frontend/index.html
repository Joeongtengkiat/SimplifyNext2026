<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>ADAPT</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="banner">
  <div class="container">
    <header>
      <span class="logo-mark">◆</span>
      <h1>ADAPT</h1>
    </header>
    <p class="tagline">"Your life changed 30 seconds ago."</p>
  </div>
</div>

<div class="container app-layout">
  <div class="calendar-col">
    <div class="card">
      <h2>Alex's calendar</h2>
      <div id="category-legend" class="category-legend"></div>
      <div class="view-toggle">
        <button data-view="day" class="active">Day</button>
        <button data-view="week">Week</button>
        <button data-view="month">Month</button>
        <button data-view="year">Year</button>
        <button data-view="range">Custom range</button>
      </div>
      <div id="range-picker" class="range-picker" style="display: none;">
        <input type="date" id="range-start" />
        <span>to</span>
        <input type="date" id="range-end" />
      </div>
      <div id="calendar-view"></div>
      <div class="actions">
        <button id="reset-btn" class="secondary">Reset demo</button>
      </div>
    </div>
  </div>

  <div class="chat-col">
    <div class="card chat-card">
      <h2>Chat with ADAPT</h2>
      <div id="chat-thread">
        <div class="chat-msg agent">
          <div class="avatar agent-avatar">◆</div>
          <div class="bubble">
            Tell me what changed ("Marketing assignment deadline moved from Friday to Tuesday"), or
            ask about your free time ("which days am I free for more than 2 hours?").
          </div>
        </div>
      </div>
      <div class="query-suggestions">
        <button data-q="Marketing assignment deadline moved from Friday to Tuesday">Deadline moved up</button>
        <button data-q="Which days am I free for more than 2 hours?">Free for 2+ hours?</button>
        <button data-q="What time should I go to the gym?">What time for the gym?</button>
      </div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="Tell ADAPT what changed, or ask about your time..." />
        <button id="chat-send">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  const calendarViewEl = document.getElementById("calendar-view");
  const categoryLegendEl = document.getElementById("category-legend");
  const rangePickerEl = document.getElementById("range-picker");
  const rangeStartEl = document.getElementById("range-start");
  const rangeEndEl = document.getElementById("range-end");
  const resetBtn = document.getElementById("reset-btn");
  const chatThreadEl = document.getElementById("chat-thread");
  const chatInputEl = document.getElementById("chat-input");
  const chatSendBtn = document.getElementById("chat-send");

  let currentView = "day";
  let latestState = null;
  let currentDay = new Date(ANCHOR_MONDAY);

  function todayISO(date) {
    return date.toISOString().slice(0, 10);
  }

  async function refreshCalendar() {
    latestState = await fetchState();
    renderCategoryLegend(categoryLegendEl, latestState);
    renderCurrentView();
  }

  function renderCurrentView() {
    if (!latestState) return;
    if (currentView === "day") renderDayViewWithNav();
    else if (currentView === "week") renderWeekView(calendarViewEl, latestState, ANCHOR_MONDAY);
    else if (currentView === "month") renderMonthView(calendarViewEl, latestState, currentDay);
    else if (currentView === "year") renderYearView(calendarViewEl, latestState, currentDay.getFullYear());
    else if (currentView === "range") {
      const start = rangeStartEl.value ? new Date(rangeStartEl.value) : ANCHOR_MONDAY;
      const end = rangeEndEl.value ? new Date(rangeEndEl.value) : new Date(ANCHOR_MONDAY.getTime() + 6 * 86400000);
      renderRangeView(calendarViewEl, latestState, start, end);
    }
  }

  function renderDayViewWithNav() {
    renderDayView(calendarViewEl, latestState, currentDay);
    const nav = document.createElement("div");
    nav.className = "day-nav";
    nav.innerHTML = `<button id="day-prev" class="secondary">← Prev</button><button id="day-next" class="secondary">Next →</button>`;
    calendarViewEl.appendChild(nav);
    document.getElementById("day-prev").addEventListener("click", () => {
      currentDay.setDate(currentDay.getDate() - 1);
      renderDayViewWithNav();
    });
    document.getElementById("day-next").addEventListener("click", () => {
      currentDay.setDate(currentDay.getDate() + 1);
      renderDayViewWithNav();
    });
  }

  document.querySelectorAll(".view-toggle button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".view-toggle button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      currentView = btn.dataset.view;
      rangePickerEl.style.display = currentView === "range" ? "flex" : "none";
      if (currentView === "range" && !rangeStartEl.value) {
        rangeStartEl.value = todayISO(ANCHOR_MONDAY);
        rangeEndEl.value = todayISO(new Date(ANCHOR_MONDAY.getTime() + 6 * 86400000));
      }
      renderCurrentView();
    });
  });

  rangeStartEl.addEventListener("change", renderCurrentView);
  rangeEndEl.addEventListener("change", renderCurrentView);

  resetBtn.addEventListener("click", async () => {
    await resetState();
    chatThreadEl.innerHTML = `
      <div class="chat-msg agent">
        <div class="avatar agent-avatar">◆</div>
        <div class="bubble">Demo reset. Tell me what changed, or ask about your free time.</div>
      </div>
    `;
    refreshCalendar();
  });

  // ---- chat ----

  function scrollChatToBottom() {
    chatThreadEl.scrollTop = chatThreadEl.scrollHeight;
  }

  function appendUserMessage(text) {
    const div = document.createElement("div");
    div.className = "chat-msg user";
    div.innerHTML = `<div class="bubble"></div>`;
    div.querySelector(".bubble").textContent = text;
    chatThreadEl.appendChild(div);
    scrollChatToBottom();
  }

  function appendAgentMessage() {
    const div = document.createElement("div");
    div.className = "chat-msg agent";
    div.innerHTML = `<div class="avatar agent-avatar">◆</div><div class="bubble"></div>`;
    chatThreadEl.appendChild(div);
    scrollChatToBottom();
    return div.querySelector(".bubble");
  }

  async function sendChat(text) {
    if (!text) return;
    appendUserMessage(text);
    chatInputEl.value = "";
    const bubble = appendAgentMessage();
    bubble.innerHTML = `<span class="spinner"></span>Thinking...`;
    chatSendBtn.disabled = true;

    try {
      const resp = await fetch(`${API_BASE}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
      const data = await resp.json();
      bubble.innerHTML = "";

      if (data.kind === "adaptation") {
        if (!data.proposal) {
          bubble.textContent = `Couldn't work out a plan for that.${data.warnings ? " " + data.warnings.join(" ") : ""}`;
          return;
        }
        const stepsDiv = document.createElement("div");
        renderSteps(stepsDiv, data.steps);
        bubble.appendChild(stepsDiv);
        const proposalDiv = document.createElement("div");
        bubble.appendChild(proposalDiv);
        renderProposal(proposalDiv, data.proposal, { onExecuted: refreshCalendar });
      } else if (data.kind === "query") {
        if (!data.query_response) {
          bubble.textContent = `Couldn't answer that.${data.warnings ? " " + data.warnings.join(" ") : ""}`;
          return;
        }
        renderSlotPicker(bubble, data.query_response, { onScheduled: refreshCalendar });
      }
      scrollChatToBottom();
    } catch (err) {
      bubble.textContent = `Error: ${err.message}. Is the backend running (uvicorn backend.main:app)?`;
    } finally {
      chatSendBtn.disabled = false;
    }
  }

  chatSendBtn.addEventListener("click", () => sendChat(chatInputEl.value.trim()));
  chatInputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendChat(chatInputEl.value.trim());
  });
  document.querySelectorAll(".query-suggestions button").forEach((btn) => {
    btn.addEventListener("click", () => sendChat(btn.dataset.q));
  });

  refreshCalendar();
</script>
</body>
</html>

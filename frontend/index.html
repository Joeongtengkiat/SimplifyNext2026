<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PhishTrace</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="banner">
  <div class="container">
    <header>
      <img src="../extension/icons/icon48.png" alt="" />
      <h1>PhishTrace</h1>
    </header>
    <p class="tagline">
      Paste a suspicious email/message, or just a URL. Type <code>-trust &lt;domain&gt;</code> to
      add a domain to the trusted list.
    </p>
  </div>
</div>

<div class="container">
  <div class="card">
    <textarea id="input" placeholder="Paste text or a URL here, or type: -trust example.com"></textarea>
    <div class="actions">
      <button id="submit">Investigate</button>
      <span id="status"></span>
    </div>
  </div>

  <div id="steps"></div>
  <div id="verdict"></div>
</div>

<script src="app.js"></script>
<script>
  wireUpForm({
    inputEl: document.getElementById("input"),
    submitEl: document.getElementById("submit"),
    statusEl: document.getElementById("status"),
    stepsEl: document.getElementById("steps"),
    verdictEl: document.getElementById("verdict"),
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PhishTrace</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="banner">
  <header>
    <img src="icons/icon48.png" alt="" />
    <h1>PhishTrace</h1>
  </header>
  <p class="tagline">
    Paste a message or a URL. Type <code>-trust &lt;domain&gt;</code> to trust it.
  </p>
</div>

<div class="container">
  <div class="card">
    <textarea id="input" placeholder="Paste text or a URL here..."></textarea>
    <div class="actions">
      <button id="submit">Investigate</button>
      <span id="status"></span>
    </div>
  </div>

  <div id="steps"></div>
  <div id="verdict"></div>

  <div id="protect-toggle" class="card" style="margin-top: 12px; padding: 10px 12px;">
    <label style="display: flex; align-items: center; gap: 8px; font-size: 11.5px; cursor: pointer;">
      <input type="checkbox" id="auto-protect" />
      Auto-check new sites while browsing (uses AWS Bedrock -- off by default)
    </label>
  </div>
</div>

<script src="app.js"></script>
<script src="popup.js"></script>
</body>
</html>

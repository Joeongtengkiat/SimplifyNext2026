<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PhishTrace</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="container">
  <header>
    <img src="icons/icon48.png" alt="" />
    <h1>PhishTrace</h1>
  </header>
  <p class="tagline">
    Paste a suspicious email/message or a URL. Type <code>-trust &lt;domain&gt;</code> to trust it.
  </p>

  <textarea id="input" placeholder="Paste text or a URL here..."></textarea>
  <div class="actions">
    <button id="submit">Investigate</button>
    <span id="status"></span>
  </div>

  <div id="steps"></div>
  <div id="verdict"></div>
</div>

<script src="app.js"></script>
<script src="popup.js"></script>
</body>
</html>
